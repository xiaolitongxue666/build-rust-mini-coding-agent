[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
# 第 14 课：官方 MCP SDK，对齐课上 go-sdk。不手写 JSON-RPC。
http = "1"
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "process", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
