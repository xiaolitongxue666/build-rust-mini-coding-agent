[package]
name = "build-rust-mini-coding-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "用 Rust 按 byo-coding-agent 课程重建的学习用 harness；live 走 DeepSeek"

# bin = 总体（src/main.rs）。每个 [[example]] = 单课 demo。
# https://doc.rust-lang.org/cargo/reference/cargo-targets.html#examples
# test = true：example 里的 #[test] 给 test-lessons.sh 用。

[[example]]
name = "lesson_01"
path = "examples/01-the-agent-loop.rs"
test = true

[[example]]
name = "lesson_02"
path = "examples/02-the-permission-gate.rs"
test = true

[[example]]
name = "lesson_03"
path = "examples/03-the-provider-interface.rs"
test = true

[[example]]
name = "lesson_04"
path = "examples/04-ui-polish.rs"
test = true

[[example]]
name = "lesson_05"
path = "examples/05-slash-commands.rs"
test = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
rustyline = "15"
